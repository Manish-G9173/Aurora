zerops:
  - setup: aurora-api
    build:
      base: python@3.12
      buildCommands:
        - pip3 install --upgrade pip
        - pip3 install --no-cache-dir -r requirements.txt
      deployFiles:
        - aurora/backend/app/~app
        - aurora/backend/workers/~workers
        - aurora/backend/requirements.txt
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
          wsSupport: true
      envSecrets:
        - GEMINI_API_KEY
        - WORKER_SECRET
      env:
        - DATABASE_URL=postgresql+asyncpg://${aurorapostgre_user}:${aurorapostgre_password}@${aurorapostgre_hostname}:5432/${aurorapostgre_dbName}
        - REDIS_URL=redis://${auroravalkey_hostname}:6379/0
        - S3_BUCKET=${aurorastorage_bucketName}
        - S3_ACCESS_KEY=${aurorastorage_accessKeyId}
        - S3_SECRET_KEY=${aurorastorage_secretAccessKey}
        - S3_ENDPOINT=${aurorastorage_apiUrl}
        - STORAGE_REGION=zerops
        - STORAGE_FORCE_PATH_STYLE=true
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      readinessCheck:
        httpGet:
          path: /healthz
          port: 8000

  - setup: aurora-worker
    build:
      base: python@3.12
      buildCommands:
        - pip3 install --upgrade pip
        - pip3 install --no-cache-dir -r requirements.txt
      deployFiles:
        - aurora/backend/app/~app
        - aurora/backend/workers/~workers
        - aurora/backend/requirements.txt
    run:
      base: python@3.12
      envSecrets:
        - GEMINI_API_KEY
        - WORKER_SECRET
      env:
        - DATABASE_URL=postgresql+asyncpg://${aurorapostgre_user}:${aurorapostgre_password}@${aurorapostgre_hostname}:5432/${aurorapostgre_dbName}
        - REDIS_URL=redis://${auroravalkey_hostname}:6379/0
        - S3_BUCKET=${aurorastorage_bucketName}
        - S3_ACCESS_KEY=${aurorastorage_accessKeyId}
        - S3_SECRET_KEY=${aurorastorage_secretAccessKey}
        - S3_ENDPOINT=${aurorastorage_apiUrl}
        - STORAGE_REGION=zerops
        - STORAGE_FORCE_PATH_STYLE=true
      crontab:
        - command: python3 -m workers.digest_worker
          timing: "0 9 * * 1"
          allContainers: false
          workingDir: /var/www
    deploy:
      readinessCheck:
        none

  - setup: aurora-frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd aurora/frontend && pnpm install && pnpm build
      deployFiles:
        - aurora/frontend/dist/~
    run:
      base: static
      envReplace:
        delimiter:
          - "__"
          - "%%"
        target:
          - ./
